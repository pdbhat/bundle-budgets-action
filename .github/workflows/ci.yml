name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Self-Test Bundle Budget Action
        uses: ./
        with:
          directory: 'dist'
          config-file: '.bundle-budgetrc.json'
          fail-on-breach: true
          comment-on-pr: false
