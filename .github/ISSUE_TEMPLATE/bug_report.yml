name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior or minimal sample repository.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Action / CLI Version
      placeholder: e.g. v1.0.0
    validations:
      required: false
